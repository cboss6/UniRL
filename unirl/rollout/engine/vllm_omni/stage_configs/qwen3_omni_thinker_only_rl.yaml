# Thinker-only stage config for Qwen3-Omni RL training with vllm-omni.
#
# vLLM-Omni normally loads 3 stages (Thinker, Talker, Code2Wav), splitting GPUs
# across them. For Thinker-only RL (GSPO/GRPO), we run ONE stage that uses ALL
# available GPUs for tensor parallelism. The ``worker_extension_cls`` below wires
# the rollout weight-sync receiver onto the AR worker.
#
# 8-GPU / TP=8 variant. See qwen3_omni_thinker_only_rl_1x4.yaml for the 4-GPU
# / TP=4 variant.
stage_args:
  - stage_id: 0
    runtime:
      devices: "0,1,2,3,4,5,6,7"
    engine_args:
      # ── Stage identity ──
      model_stage: thinker
      model_arch: Qwen3OmniMoeThinkerForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      engine_output_type: text
      hf_config_name: thinker_config

      # ── Parallelism & backend ──
      tensor_parallel_size: 8
      distributed_executor_backend: "mp"

      # ── Memory & batching (critical: top-level CLI args are stripped) ──
      gpu_memory_utilization: 0.4
      max_num_seqs: 64
      max_num_batched_tokens: 32768
      enable_chunked_prefill: true

      # ── Model loading ──
      dtype: bfloat16
      load_format: safetensors
      trust_remote_code: true
      enable_prefix_caching: false
      enforce_eager: true

      # ── LoRA (required for adapter hot-loading) ──
      enable_lora: true
      max_lora_rank: 64
      max_loras: 1

      # ── weight-sync receiver ──
      # Compose the receive extension onto the AR worker (GPUARWorker) so it exposes
      # set_lora_from_tensor_dict[_copy] + update_weights_from_ipc that the trainer's
      # RemoteLoraWeightSync.push targets. Without it the push raises
      # "'GPUARWorker' object has no attribute 'set_lora_from_tensor_dict_copy'".
      worker_extension_cls: unirl.rollout.engine.vllm_omni.worker.qwen3_omni_ar_extension.Qwen3OmniARWeightSyncExtension

      # ── sleep-mode / logprobs / stats ──
      enable_sleep_mode: true
      logprobs_mode: processed_logprobs
      disable_log_stats: true
    final_output: true
    final_output_type: text
    is_comprehension: true
